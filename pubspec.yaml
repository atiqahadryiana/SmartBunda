name: smartbunda
description: Prototype nutrition tracker for pregnant mothers with RBAC.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  collection: ^1.18.0
  intl: ^0.20.2
  crypto: ^3.0.3
  shared_preferences: ^2.3.2
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  firebase_ai: ^3.12.2
  google_sign_in: ^7.1.0
  cloud_firestore: ^6.1.1
  cloud_functions: ^6.0.4
  firebase_storage: ^13.0.5
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  image: ^4.3.0
  file_picker: ^8.0.0
  excel: ^4.0.2
  table_calendar: ^3.0.0
  pdf: ^3.11.0
  printing: ^5.13.0
  share_plus: ^12.0.2
  fl_chart: ^0.69.0
  http: ^1.2.0
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  # On-device YOLOv8n-cls food classifier (TFLite). Runs first in the meal
  # scanner chain; falls back to the Gemini cloud scanners when confidence is
  # low or the model asset is absent. See lib/services/yolo_food_classifier_service.dart
  tflite_flutter: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.4

# App launcher icon — generated from assets/logo.png (replaces the default
# Flutter icon). Regenerate after changing the logo with:
#   flutter pub get
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/logo.png"
  android: true
  # Adaptive icon (Android 8+): the card-free logo ART (white card removed,
  # see assets/logo_foreground.png) floats directly on a soft blush background,
  # so there's no inner card or corner ring under the round/squircle mask.
  adaptive_icon_background: "#FFF5F8"
  adaptive_icon_foreground: "assets/logo_foreground.png"
  adaptive_icon_foreground_inset: 12
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#FFF5F8"
    theme_color: "#EC407A"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/foods_my.json
    # On-device YOLOv8n-cls model + labels (produced by
    # malaysian-food-dataset/yolo_pipeline.py export). The scanner degrades
    # gracefully to the Gemini chain when these are missing, so the app still
    # builds and runs before the model has been trained/dropped in.
    - assets/ml/
