name: smartbunda
description: Prototype nutrition tracker for pregnant mothers with RBAC.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  collection: ^1.18.0
  intl: ^0.20.2
  crypto: ^3.0.3
  shared_preferences: ^2.3.2
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  firebase_storage: ^13.0.5
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  file_picker: ^8.0.0
  excel: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/foods_my.json
